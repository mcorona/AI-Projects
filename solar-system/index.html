<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#03040a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="description" content="Modelo interactivo 3D del sistema solar, optimizado para moviles Android." />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<title>Sistema Solar Interactivo</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #03040a; color: #e8ecf6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden; overscroll-behavior: none;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }

  #loading {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #0b1230 0%, #03040a 70%);
    z-index: 50; gap: 14px;
  }
  #loading .ring {
    width: 46px; height: 46px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.15); border-top-color: #ffd76a;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading span { font-size: 13px; letter-spacing: 0.06em; color: #9aa4c7; text-transform: uppercase; }

  header#topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    padding: max(10px, env(safe-area-inset-top)) 14px 10px 14px;
    background: linear-gradient(to bottom, rgba(3,4,10,0.85), rgba(3,4,10,0));
    pointer-events: none;
  }
  header#topbar h1 {
    font-size: 15px; margin: 0; font-weight: 600; letter-spacing: 0.02em;
    display: flex; align-items: center; gap: 8px;
  }
  header#topbar h1 .dot { width: 8px; height: 8px; border-radius: 50%; background: #ffd76a; box-shadow: 0 0 8px #ffd76a; }

  button {
    font: inherit; color: inherit; background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 12px;
    padding: 9px 12px; pointer-events: auto; -webkit-user-select: none; user-select: none;
  }
  button:active { background: rgba(255,255,255,0.18); }

  #hint {
    position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%);
    z-index: 15; font-size: 12px; color: #9aa4c7; background: rgba(10,12,26,0.6);
    padding: 6px 12px; border-radius: 999px; pointer-events: none; opacity: 1;
    transition: opacity 0.6s ease; white-space: nowrap; border: 1px solid rgba(255,255,255,0.08);
  }
  #hint.hidden { opacity: 0; }

  #panel {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
    transform: translateY(100%); transition: transform 0.35s cubic-bezier(.2,.8,.2,1);
    background: rgba(9,11,26,0.92); backdrop-filter: blur(14px);
    border-top-left-radius: 20px; border-top-right-radius: 20px;
    border-top: 1px solid rgba(255,255,255,0.1);
    padding: 16px 18px max(16px, env(safe-area-inset-bottom)) 18px;
    max-height: 46vh; overflow-y: auto;
  }
  #panel.open { transform: translateY(0); }
  #panel .grabber { width: 36px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.2); margin: 0 auto 12px auto; }
  #panel .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  #panel h2 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 10px; }
  #panel h2 .swatch { width: 14px; height: 14px; border-radius: 50%; flex: none; }
  #panel .close { background: rgba(255,255,255,0.08); border-radius: 50%; width: 32px; height: 32px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  #panel p.desc { font-size: 13.5px; line-height: 1.5; color: #c7cde3; margin: 10px 0 14px 0; }
  #panel .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #panel .stat { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 8px 10px; }
  #panel .stat .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: #8b93b8; }
  #panel .stat .v { font-size: 14px; font-weight: 600; margin-top: 2px; }

  #toolbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 12px max(10px, env(safe-area-inset-bottom)) 12px;
    background: linear-gradient(to top, rgba(3,4,10,0.9), rgba(3,4,10,0));
  }
  #toolbar button { display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; padding: 0; font-size: 18px; border-radius: 50%; }
  #toolbar #speedLabel { font-size: 11px; color: #9aa4c7; min-width: 54px; text-align: center; }
  #toolbar .sep { width: 1px; height: 24px; background: rgba(255,255,255,0.12); margin: 0 2px; }

  #planetList {
    position: fixed; top: 0; bottom: 0; right: 0; z-index: 22;
    width: 84px; padding-top: max(56px, calc(env(safe-area-inset-top) + 50px));
    padding-bottom: 90px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
    pointer-events: none;
  }
  #planetList .item {
    pointer-events: auto; margin-left: auto; margin-right: 10px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: rgba(10,12,26,0.55); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; padding: 6px 4px; width: 64px;
  }
  #planetList .item .sw { width: 16px; height: 16px; border-radius: 50%; }
  #planetList .item span { font-size: 9.5px; color: #cfd4ea; text-align: center; line-height: 1.1; }
  #planetList .item:active { background: rgba(255,255,255,0.15); }

  #panelBackdrop {
    position: fixed; inset: 0; z-index: 24; background: rgba(0,0,0,0);
    pointer-events: none; transition: background 0.35s ease;
  }
  #panelBackdrop.open { pointer-events: auto; background: rgba(0,0,0,0.35); }
</style>
</head>
<body>

<div id="loading"><div class="ring"></div><span>Cargando el sistema solar…</span></div>

<div id="app"></div>

<header id="topbar">
  <h1><span class="dot"></span>Sistema Solar</h1>
  <button id="btnLabels" aria-label="Mostrar/ocultar nombres">🏷️</button>
</header>

<div id="planetList"></div>

<div id="hint">Arrastra para girar · pellizca para zoom · toca un planeta</div>

<div id="panelBackdrop"></div>
<div id="panel">
  <div class="grabber"></div>
  <div class="row">
    <h2><span class="swatch" id="panelSwatch"></span><span id="panelName">—</span></h2>
    <button class="close" id="panelClose">✕</button>
  </div>
  <p class="desc" id="panelDesc"></p>
  <div class="stats" id="panelStats"></div>
</div>

<div id="toolbar">
  <button id="btnPause" aria-label="Pausar">⏸️</button>
  <button id="btnSlower" aria-label="Reducir velocidad">−</button>
  <span id="speedLabel">1x</span>
  <button id="btnFaster" aria-label="Aumentar velocidad">+</button>
  <div class="sep"></div>
  <button id="btnOrbits" aria-label="Mostrar/ocultar orbitas">⭕</button>
  <button id="btnReset" aria-label="Restablecer vista">🎯</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.min.js",
    "three/addons/": "./vendor/three/examples/jsm/"
  }
}
</script>
<script type="module" src="main.js"></script>
</body>
</html>
